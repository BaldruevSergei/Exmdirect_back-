spring.application.name=exmdirect_new
spring.datasource.url=jdbc:postgresql://localhost:5432/Exmdirect
spring.datasource.username=postgres
spring.datasource.password=30041978
spring.datasource.driver-class-name=org.postgresql.Driver
server.address=0.0.0.0
server.port=8081
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.file.name=logs/app.log
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.multipart=DEBUG
logging.level.org.springframework.security=DEBUG

# Hibernate ?????????
logging.level.org.hibernate.tool.schema=DEBUG

logging.level.org.hibernate.transaction=DEBUG
spring.flyway.enabled=false

#springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.swagger-ui.config-url=/v3/api-docs


spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

